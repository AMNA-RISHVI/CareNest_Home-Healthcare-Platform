{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareNest - Service Review & Rating</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{% static 'appointment/css/review_rate.css' %}"></head>
<body>

    <!-- CareNest Rating & Review Component Card -->
    <div class="rating-card" id="ratingWidget">
        <div class="rating-header">
            <h6>Rate Service</h6>
            <span class="close-btn" onclick="closeWidget()">&times;</span>
        </div>

        <!-- Professional Summary -->
        <div class="pro-info">
            <div class="pro-avatar">
                <i class="fas fa-user-nurse"></i>
            </div>
            <div class="pro-details">
                <h6>{{professional.User.full_name}}</h6>
                <span>{{professional.service_type}}</span>
               
                
                <p> {{ professional.User.full_name }}</p>
                <p> {{ professional.service_type }}</p>
            </div>
        </div>

        <form id="reviewForm">
            <!-- Interactive Star Rating -->
            <div class="star-rating">
                <input type="radio" id="star5" name="rating" value="5" />
                <label for="star5" title="5 Stars"><i class="fas fa-star"></i></label>

                <input type="radio" id="star4" name="rating" value="4" />
                <label for="star4" title="4 Stars"><i class="fas fa-star"></i></label>

                <input type="radio" id="star3" name="rating" value="3" />
                <label for="star3" title="3 Stars"><i class="fas fa-star"></i></label>

                <input type="radio" id="star2" name="rating" value="2" />
                <label for="star2" title="2 Stars"><i class="fas fa-star"></i></label>

                <input type="radio" id="star1" name="rating" value="1" />
                <label for="star1" title="1 Star"><i class="fas fa-star"></i></label>
            </div>

            <!-- Review Message Input -->
            <div class="mb-3">
                <textarea class="form-control feedback-textarea" id="reviewComment" rows="3" placeholder="Write feedback for CareNest team..." maxlength="200"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">
                <i class="far fa-paper-plane me-1"></i> Submit Review
            </button>
        </form>

        <div id="statusMessage" class="status-msg"></div>
    </div>
    <script src="{% static 'appointment/js/review.js' %}"></script>

</body>
</html>
