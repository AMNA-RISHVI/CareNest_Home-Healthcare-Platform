{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareNest - Appointment Payment</title>

    <link rel="stylesheet" href="{% static 'css/payment.css' %}">
</head>

<body>

<header class="navbar">

    <div class="brand">

        <img
            src="{% static 'images/carenest-logo.png' %}"
            alt="CareNest Logo"
            class="brand-logo"
        >

        <span class="brand-name">
            <span class="brand-care">Care</span><span class="brand-nest">Nest</span>
        </span>

    </div>

    <div class="secure-payment">
        Secure Payment
    </div>

</header>


<main class="payment-container">

    <section class="payment-card">

        <div class="payment-header">

            <h1>Appointment Payment</h1>

            <p>
                Complete your appointment fee payment.
            </p>

        </div>


        <div class="plan-summary">

            <div class="plan-info">

                <span class="label">
                    Appointment Fee
                </span>

                <h2>
                    CareNest Appointment
                </h2>

            </div>

            <div class="plan-price">
                Rs. 3,000.00
            </div>

        </div>


        <form id="appointment-payment-form">

            {% csrf_token %}

            <h2 class="section-title">
                Payment Details
            </h2>


            <div class="form-group">

                <label for="cardholder-name">
                    Cardholder Name
                </label>

                <input
                    type="text"
                    id="cardholder-name"
                    placeholder="Enter cardholder name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="card-number">
                    Card Number
                </label>

                <input
                    type="text"
                    id="card-number"
                    placeholder="1234 5678 9012 3456"
                    maxlength="19"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="expiry">
                        Expiry Date
                    </label>

                    <input
                        type="text"
                        id="expiry"
                        placeholder="MM / YY"
                        maxlength="5"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="cvv">
                        CVV
                    </label>

                    <input
                        type="password"
                        id="cvv"
                        placeholder="123"
                        maxlength="4"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                id="pay-button"
            >

                <span class="lock-icon">🔒</span>

                <span>Pay Now</span>

            </button>


            <div class="security-message">

                <span class="security-icon">
                    ♢
                </span>

                <span>
                    Your payment information is secure and encrypted.
                </span>

            </div>

        </form>


        <div
            id="appointment-payment-result"
            class="payment-result hidden"
        ></div>

    </section>

</main>

<script>

document
    .getElementById("appointment-payment-form")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const button =
            document.getElementById("pay-button");

        const result =
            document.getElementById(
                "appointment-payment-result"
            );

        button.disabled = true;

        button.innerHTML =
            "Processing Payment...";

        fetch(
            "{% url 'appointment-payment' appointment_id=appointment.appointment_id %}",
            {
                method: "POST",
                headers: {
                    "X-CSRFToken": document.querySelector(
                        "[name=csrfmiddlewaretoken]"
                    ).value,
                    "Content-Type": "application/json"
                }
            }
        )
        .then(response => response.json())
        .then(data => {

            if (data.success) {

                document
                    .getElementById(
                        "appointment-payment-form"
                    )
                    .classList
                    .add("hidden");

                result.classList.remove("hidden");

                result.innerHTML = `
                    <div style="text-align:center; padding:30px;">

                        <div style="font-size:50px;">
                            ✅
                        </div>

                        <h2 style="margin-top:15px;">
                            Payment Successful
                        </h2>

                        <p style="margin-top:10px;">
                            Your appointment payment has been completed successfully.
                        </p>

                        <p style="margin-top:10px;">
                            Thank you for using CareNest.
                        </p>

                        <a href="{% url 'patient_dashboard:dashboard' %}"
                           style="display:inline-block; margin-top:20px; background:#0f766e; color:white; padding:10px 18px; border-radius:8px; text-decoration:none; font-weight:600;">
                            Back to Dashboard
                        </a>

                    </div>
                `;

            } else {

                button.disabled = false;
                button.innerHTML =
                    '<span class="lock-icon">🔒</span><span>Pay Now</span>';

                alert(data.error || "Payment failed.");

            }

        })
        .catch(error => {

            console.error(error);

            button.disabled = false;

            button.innerHTML =
                '<span class="lock-icon">🔒</span><span>Pay Now</span>';

            alert("Something went wrong. Please try again.");

        });

    });

</script>

</body>

</html>
