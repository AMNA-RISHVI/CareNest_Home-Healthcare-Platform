{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareNest - Payment</title>

    <link rel="stylesheet" href="{% static 'css/payment.css' %}">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="brand">

            <img
                src="{% static 'images/carenest-logo.png' %}"
                alt="CareNest Logo"
                class="brand-logo"
            >

            <span class="brand-name">
                <span class="brand-care">Care</span><span class="brand-nest">Nest</span>
            </span>

        </div>

        <div class="secure-payment">
            Secure Payment
        </div>

    </header>


    <!-- Main Content -->
    <main class="payment-container">

        <section class="payment-card">

            <!-- Page Heading -->
            <div class="payment-header">

                <h1>Complete Your Payment</h1>

                <p>
                    You're one step away from activating your CareNest plan.
                </p>

            </div>


            <!-- Selected Subscription -->
            <div class="plan-summary">

                <div class="plan-info">

                    <span class="label">
                        Selected Plan
                    </span>

                    <h2 id="plan-name">
                        Family Plan
                    </h2>

                </div>

                <div class="plan-price" id="plan-price">
                    Rs. 3,000.00
                </div>

            </div>


            <!-- Payment Form -->
            <form id="payment-form">
                {% csrf_token %}

                <h2 class="section-title">
                    Payment Details
                </h2>


                <!-- Cardholder Name -->
                <div class="form-group">

                    <label for="cardholder-name">
                        Cardholder Name
                    </label>

                    <input
                        type="text"
                        id="cardholder-name"
                        placeholder="Enter cardholder name"
                        required
                    >

                </div>


                <!-- Card Number -->
                <div class="form-group">

                    <label for="card-number">
                        Card Number
                    </label>

                    <input
                        type="text"
                        id="card-number"
                        placeholder="1234 5678 9012 3456"
                        maxlength="19"
                        required
                    >

                </div>


                <!-- Expiry + CVV -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="expiry">
                            Expiry Date
                        </label>

                        <input
                            type="text"
                            id="expiry"
                            placeholder="MM / YY"
                            maxlength="5"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="cvv">
                            CVV
                        </label>

                        <div class="cvv-container">

                            <input
                                type="password"
                                id="cvv"
                                placeholder="123"
                                maxlength="4"
                                required
                            >

                            <span class="cvv-help">
                                ?
                            </span>

                        </div>

                    </div>

                </div>


                <!-- Pay Button -->
                <button
                    type="submit"
                    id="pay-button"
                >

                    <span class="lock-icon">🔒</span>

                    <span>Pay Now</span>

                </button>


                <!-- Security Message -->
                <div class="security-message">

                    <span class="security-icon">
                        ♢
                    </span>

                    <span>
                        Your payment information is secure and encrypted.
                    </span>

                </div>


            </form>


            <!-- Payment Result -->
            <div
                id="payment-result"
                class="payment-result hidden"
            ></div>

        </section>

    </main>


    <script src="{% static 'js/payment.js' %}"></script>

</body>

</html>
