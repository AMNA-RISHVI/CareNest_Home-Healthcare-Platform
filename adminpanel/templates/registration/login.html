<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareNest Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Exact colors from your mockups */
        .teal-bg { background-color: #0b5e5c; }
        .teal-btn { background-color: #0b5e5c; }
        .teal-btn:hover { background-color: #0a4a48; }
        .teal-text { color: #0b5e5c; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">

    <!-- Login Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header with logo -->
        <div class="teal-bg p-8 text-white text-center">
            <div class="flex justify-center items-center gap-2 mb-4">
                <i class="fas fa-heartbeat text-3xl text-orange-400"></i>
                <span class="text-3xl font-bold tracking-wide">CareNest</span>
            </div>
            <p class="text-teal-100 text-sm opacity-90">Admin Panel & Dashboard</p>
        </div>

        <!-- Form Body -->
        <div class="p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-2">Welcome Back</h2>
            <p class="text-sm text-gray-500 mb-6">Sign in to manage your platform</p>

            <!-- Django Login Form -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username or Email</label>
                    <input type="text" name="username" id="id_username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" placeholder="Enter your username" required>
                </div>

                <div>
                    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" id="id_password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" placeholder="Enter your password" required>
                </div>

                <!-- Optional: Django's hidden next field (already handled in URL) -->
                <input type="hidden" name="next" value="{{ next }}">

                <button type="submit" class="w-full teal-btn text-white font-semibold py-2.5 rounded-lg shadow-md transition hover:shadow-lg focus:outline-none">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-400">
                <span class="block mt-2">© 2026 CareNest. All rights reserved.</span>
            </div>
        </div>
    </div>

</body>
</html>
