<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics - CareNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #fbfbf6; padding: 2rem; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body>
    <!-- Back Button -->
    <div class="mb-6">
        <button onclick="location.href='/professionalpanel/dashboard/'" class="text-teal-700 text-xl"><i class="fas fa-arrow-left"></i></button>
        <h1 class="text-3xl font-bold text-teal-800 ml-4 inline-block">Analytics</h1>
    </div>

    <!-- Stats Overview -->
    <div class="grid grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-sm card-shadow border-l-4 border-teal-400">
            <div class="text-xs text-gray-500 uppercase tracking-wider">Total Patients Served</div>
            <div class="text-3xl font-bold text-teal-700 mt-1">{{ total_patients }}</div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm card-shadow border-l-4 border-green-400">
            <div class="text-xs text-gray-500 uppercase tracking-wider">Completed Appointments</div>
            <div class="text-3xl font-bold text-green-700 mt-1">{{ total_appts }}</div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm card-shadow border-l-4 border-orange-400">
            <div class="text-xs text-gray-500 uppercase tracking-wider">Total Revenue Earned</div>
            <div class="text-3xl font-bold text-orange-600 mt-1">Rs. {{ total_revenue }}</div>
        </div>
    </div>

    <!-- Chart Container -->
    <div class="bg-white p-6 rounded-xl shadow-sm card-shadow">
        <h2 class="font-bold text-lg text-gray-700 mb-4">Monthly Revenue Trend</h2>
        <canvas id="revenueChart" class="w-full h-64"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('revenueChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: {{ labels|safe }},
                datasets: [{
                    label: 'Revenue (Rs.)',
                    data: {{ values|safe }},
                    backgroundColor: 'rgba(20, 184, 166, 0.6)',
                    borderColor: 'rgba(20, 184, 166, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) { return 'Rs. ' + value; }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
