<!DOCTYPE html>
<html>
<head>
    <title>Edit {{ patient.patient_name }}</title>
</head>

<body>

    <h1>
        Edit {{ patient.patient_name }}
    </h1>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>

        <a
            href="{% url 'patient_dashboard:patient_detail' patient.patient_id %}"
        >
            Cancel
        </a>

    </form>

</body>
</html>
