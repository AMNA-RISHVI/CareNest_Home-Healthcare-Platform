{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}CareNest{% endblock %}

    </title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Authentication CSS -->

    <link rel="stylesheet"
          href="{% static 'authentication/css/auth.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>


{% if messages %}

    <div class="auth-notification-container">

        {% for message in messages %}

            <div
                class="auth-notification {{ message.tags }}"
                role="alert">

                <span class="notification-text">
                    {{ message }}
                </span>

                <button
                    type="button"
                    class="notification-close"
                    onclick="closeNotification(this)">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

        {% endfor %}

    </div>

{% endif %}


<div class="auth-page">
    {% block content %}
    {% endblock %}
</div>


<script>
document.addEventListener("DOMContentLoaded", function () {
    const notifications =
        document.querySelectorAll(".auth-notification");

    notifications.forEach(function (notification) {
        setTimeout(function () {
            notification.style.animation =
                "notificationSlideOut 0.3s ease forwards";

            setTimeout(function () {
                notification.remove();
            }, 300);
        }, 10000);
    });
});

function closeNotification(button) {
    const notification =
        button.closest(".auth-notification");

    if (!notification) {
        return;
    }

    notification.style.animation =
        "notificationSlideOut 0.3s ease forwards";

    setTimeout(function () {
        notification.remove();
    }, 300);
}
</script>


<script src="{% static 'authentication/js/auth.js' %}"></script>

{% block extra_js %}
{% endblock %}

</body>

</html>
