{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}CareNest{% endblock %}

    </title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Authentication CSS -->

    <link rel="stylesheet"
          href="{% static 'authentication/css/auth.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

<div class="auth-page">

    {% block content %}
    {% endblock %}

</div>

<script src="{% static 'authentication/js/auth.js' %}"></script>

{% block extra_js %}
{% endblock %}

</body>

</html>
