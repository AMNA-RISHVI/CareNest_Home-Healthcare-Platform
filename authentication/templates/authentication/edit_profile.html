{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Edit Profile</h3>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{% for field in form %}

<div class="mb-3">

<label class="form-label">

{{ field.label }}

</label>

{{ field }}

{% if field.errors %}

<div class="invalid-feedback d-block">

{% for error in field.errors %}

{{ error }}

{% endfor %}

</div>

{% endif %}

</div>

{% endfor %}

<button class="btn btn-success">

Save Changes

</button>

<a href="{% url 'profile' %}"

class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
