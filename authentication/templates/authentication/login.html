{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}


<!DOCTYPE html>

<html>

<head>

    <title>Login</title>

</head>

<body>

<h2>Welcome Back</h2>

<h5>Sign in to manage your health</h5>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <div style="margin-bottom:15px;">
        <a href="{% url 'forgot_password' %}">
            Forgot Password?
        </a>
    </div>

    <button type="submit">

        Login

    </button>

</form>

<hr>

<p class="text-center mb-0">

    Don't have an account? 

    <a href="{% url 'register' %}">

        Create a Free Account

    </a>

</p>


</body>

</html>


{% endblock %}
