{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}


<!DOCTYPE html>

<html>

<head>

    <title>Login</title>

</head>

<body>

<h2>Login</h2>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <div style="margin-bottom:15px;">
        <a href="{% url 'forgot_password' %}">
            Forgot Password?
        </a>
    </div>

    <button type="submit">

        Login

    </button>

</form>

</body>

</html>


{% endblock %}
