{% extends "base.html" %}

{% block title %}
Admin Dashboard
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-dark text-white">

        <h3>Admin Dashboard</h3>

    </div>

    <div class="card-body">

        <h4>Welcome, {{ request.user.full_name }}</h4>

        <hr>

        <a href="{% url 'profile' %}" class="btn btn-primary">
            My Profile
        </a>

        <a href="{% url 'edit_profile' %}" class="btn btn-success">
            Edit Profile
        </a>

        <a href="{% url 'change_password' %}" class="btn btn-warning">
            Change Password
        </a>

        <a href="{% url 'logout' %}" class="btn btn-danger">
            Logout
        </a>

    </div>

</div>

{% endblock %}
